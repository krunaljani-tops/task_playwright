[pytest]
addopts = --html=reports/report.html --self-contained-html --tracing=retain-on-failure --screenshot=only-on-failure -v
testpaths = tests
markers =
    smoke: quick critical-path checks
    e2e: browser journeys
    api: API tests
    regression: full suite
base_url = https://ecomcicid.netlify.app
filterwarnings =
    ignore::DeprecationWarning
