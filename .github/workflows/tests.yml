name: Northline Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "0 2 * * *"  # nightly run at 02:00 UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke-tests:
    name: Smoke Gate (${{ matrix.browser }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: true
      matrix:
        browser: [chromium, firefox, webkit]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install Playwright browser and system deps
        run: python -m playwright install --with-deps ${{ matrix.browser }}

      - name: Run Smoke Tests (Fail Fast)
        run: |
          python -m pytest -m smoke --browser ${{ matrix.browser }} --base-url https://ecomcicid.netlify.app --html=reports/smoke-report-${{ matrix.browser }}.html --self-contained-html

      - name: Upload Smoke Test Reports & Traces
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-report-${{ matrix.browser }}
          path: |
            reports/
            test-results/
          retention-days: 14

  regression-tests:
    name: Regression Suite (${{ matrix.browser }})
    needs: smoke-tests
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install Playwright browser and system deps
        run: python -m playwright install --with-deps ${{ matrix.browser }}

      - name: Run Full Regression Suite (Parallelized)
        run: |
          python -m pytest -n auto --browser ${{ matrix.browser }} --base-url https://ecomcicid.netlify.app --html=reports/regression-report-${{ matrix.browser }}.html --self-contained-html

      - name: Upload Regression Reports, Traces & Screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: regression-report-${{ matrix.browser }}
          path: |
            reports/
            test-results/
          retention-days: 30

